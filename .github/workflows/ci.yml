name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: "PR: commit subjects, checks for what changed, compat"
        if: github.event_name == 'pull_request'
        run: scripts/ci-checks.sh pr "${{ github.event.pull_request.base.sha }}"
      - name: "main: every check and compat"
        if: github.event_name == 'push'
        run: scripts/ci-checks.sh main

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag new versions and release the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh
