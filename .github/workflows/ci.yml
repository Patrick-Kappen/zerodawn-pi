name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Lint, tests, nix checks
        run: nix flake check -L
      - name: Type check against the pinned pi types
        run: nix develop --command just types

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag new versions and release the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # One tag per extension whose version is new: <name>-v<version>.
          for manifest in extensions/*/package.json; do
            tag="$(jq -r .name "$manifest")-v$(jq -r .version "$manifest")"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then continue; fi
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
            echo "tagged $tag"
          done
          # The package: tag v<version> and a GitHub release with generated notes.
          tag="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists; no release"
          else
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
            gh release create "$tag" --title "$tag" --generate-notes
          fi
