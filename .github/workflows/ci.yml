name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: "PR: commit subjects, checks for what changed, compat"
        if: github.event_name == 'pull_request'
        run: scripts/ci-checks.sh pr "${{ github.event.pull_request.base.sha }}"
      - name: "main: every check and compat"
        if: github.event_name == 'push'
        run: scripts/ci-checks.sh main

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag new versions and release the package
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh
      - name: Update the input in Nixos with a PR
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.NIXOS_UPDATE_TOKEN }}
          INPUT: ${{ github.event.repository.name }}
          TAG: ${{ steps.release.outputs.tag }}
        run: scripts/ci-nixos-update.sh "$INPUT" "$TAG"
